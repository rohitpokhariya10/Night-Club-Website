services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jimmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: ${POSTGRES_DB:-jimmy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jimmy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jimmy}
      WEB_ORIGIN: https://${DOMAIN}
      TRUST_PROXY: "1"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        INDEXING_ENABLED: ${INDEXING_ENABLED:-false}
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      INDEXING_ENABLED: ${INDEXING_ENABLED:-false}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
